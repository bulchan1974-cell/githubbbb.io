<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanthawat | Robotic Gaming Portfolio</title>
    <!-- โหลด Font สายล้ำ และ Icon -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* สไตล์พื้นฐานโทน Mecha & Sci-Fi */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050811;
            /* พื้นหลังลายตาราง Grid เลียนแบบระบบพิกัดหุ่นยนต์ */
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                radial-gradient(at 50% 0%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
            background-size: 20px 20px, 20px 20px, 100% 100%;
            color: #c8d3e6;
            font-family: 'Prompt', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* คอนเทนเนอร์หลัก */
        .container {
            max-width: 850px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media (min-width: 768px) {
            .container {
                grid-template-columns: 320px 1fr;
            }
        }

        /* กล่องสไตล์กลไกหุ่นยนต์ (Robotic HUD Panel) */
        .robot-panel {
            background: rgba(10, 17, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #1e3a5f;
            /* ตัดมุมกล่องสไตล์ Sci-Fi Armor Plate */
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
            padding: 30px;
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.05), 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        /* เส้นมุมตกแต่งแผงเหล็ก */
        .robot-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            border-top: 2px solid #00f2fe;
            border-left: 2px solid #00f2fe;
        }

        /* การ์ดโปรไฟล์ฝั่งซ้าย (Main AI Core) */
        .profile-side {
            text-align: center;
            border-left: 3px solid #00f2fe;
        }
        
        /* กรอบเป้าเล็งรูปภาพ (Targeting Matrix) */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            padding: 8px;
            border: 1px dashed rgba(0, 242, 254, 0.4);
        }
        .avatar-container::before, .avatar-container::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #00f2fe;
            border-style: solid;
        }
        .avatar-container::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
        .avatar-container::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid #1e3a5f;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        /* สเตตัสระบบ */
        .status-badge {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f2fe;
            color: #050811;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(0, 242, 254, 0.8); }
            100% { opacity: 0.8; }
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .gamer-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: inline-block;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            padding-bottom: 4px;
        }
        .bio {
            font-size: 13px;
            color: #8fa0ba;
            margin-bottom: 25px;
            text-align: justify;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid rgba(30, 58, 95, 0.4);
        }

        /* ปุ่มประวัติส่วนตัวสไตล์โรบอทชาร์จพลังงาน */
        .history-btn-wrapper {
            margin-bottom: 20px;
        }
        .history-trigger-btn {
            width: 100%;
            background: linear-gradient(90deg, rgba(255, 59, 48, 0.1), rgba(255, 59, 48, 0.2));
            border: 1px solid #ff3b30;
            color: #ff3b30;
            font-family: 'Orbitron', 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            text-shadow: 0 0 5px rgba(255, 59, 48, 0.5);
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.1);
        }
        .history-trigger-btn:hover {
            background: #ff3b30;
            color: #050811;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.6);
            text-shadow: none;
            transform: scale(1.02);
        }
        .history-trigger-btn i {
            margin-right: 8px;
        }

        /* ปุ่มเชื่อมต่อระบบโซเชียล */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .social-btn {
            background: rgba(30, 58, 95, 0.2);
            border: 1px solid #1e3a5f;
            color: #00f2fe;
            padding: 12px 0;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.25s ease;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        }
        .social-btn:hover {
            color: #050811;
            background: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
            border-color: #00f2fe;
        }

        /* ฝั่งขวา: รายละเอียดระบบและยุทโธปกรณ์ */
        .content-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 10px;
        }
        .section-title i {
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255, 59, 48, 0.6);
        }

        /* คลังสกิล (Weapon Systems / Tech Arsenal) */
        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #1e3a5f;
            color: #a2b4ce;
            padding: 8px 16px;
            font-size: 12px;
            font-family: 'Orbitron', 'Prompt', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.2s;
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }
        .skill-badge:hover {
            border-color: #00f2fe;
            color: #fff;
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* แผงแสดงผลงาน (Mission Log / Modules) */
        .showcase-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        @media (min-width: 500px) {
            .showcase-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .showcase-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(30, 58, 95, 0.6);
            padding: 20px;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .showcase-item:hover {
            background: rgba(10, 17, 30, 0.6);
            border-color: #00f2fe;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }
        .item-icon {
            font-size: 26px;
            color: #00f2fe;
            margin-bottom: 12px;
text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
}
.showcase-title {
font-family: 'Orbitron', 'Prompt', sans-serif;
font-size: 15px;
font-weight: 700;
color: #fff;
margin-bottom: 8px;
letter-spacing: 0.5px;
}
.showcase-desc {
font-size: 12px;
color: #8fa0ba;
}
/* หน้าต่างประวัติเด้งขึ้นมา (UI Modal Overlay) */
.modal-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(5, 8, 17, 0.9);
display: flex;
justify-content: center;
align-items: center;
z-index: 9999;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s ease;
padding: 20px;
}
.modal-overlay.active {
opacity: 1;
pointer-events: auto;
}
.modal-content {
max-width: 500px;
width: 100%;
background: #0a111e;
border: 2px solid #ff3b30;
box-shadow: 0 0 30px rgba(255, 59, 48, 0.3);
padding: 30px;
clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
transform: scale(0.8);
transition: transform 0.3s ease;
}
.modal-overlay.active .modal-content {
transform: scale(1);
}
.modal-header {
font-family: 'Orbitron', sans-serif;
color: #fff;
font-size: 20px;
border-bottom: 1px solid rgba(255, 59, 48, 0.3);
padding-bottom: 10px;
margin-bottom: 20px;
display: flex;
align-items: center;
gap: 10px;
}
.history-data-list {
list-style: none;
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 25px;
}
.history-data-list li {
font-size: 14px;
border-left: 2px solid #00f2fe;
padding-left: 10px;
background: rgba(255, 255, 255, 0.02);
padding-top: 6px;
padding-bottom: 6px;
}
.history-data-list strong {
color: #00f2fe;
font-family: 'Orbitron', 'Prompt', sans-serif;
}
.close-btn {
width: 100%;
background: rgba(255, 255, 255, 0.05);
border: 1px solid #1e3a5f;
color: #8fa0ba;
padding: 10px;
cursor: pointer;
font-family: 'Orbitron', sans-serif;
font-size: 12px;
letter-spacing: 1px;
transition: all 0.2s;
}
.close-btn:hover {
background: rgba(255, 59, 48, 0.1);
border-color: #ff3b30;
color: #ff3b30;
}
